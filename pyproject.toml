[tool.poetry]
name = "opsly-backend"
version = "1.0.0"
description = "Production-grade FastAPI backend for Opsly — Field Operations ERP"
authors = ["Rahul Electricals & Creative Solutions <dev@rahulelectricals.in>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.34" }
sqlalchemy = "^2.0"
alembic = "^1.14"
psycopg2-binary = "^2.9"
pydantic = "^2.9"
pydantic-settings = "^2.6"
python-jose = { extras = ["cryptography"], version = "^3.3" }
passlib = { extras = ["bcrypt"], version = "^1.7" }
python-multipart = "^0.0.20"
boto3 = "^1.35"
redis = "^5.0"
apscheduler = "^3.10"
slowapi = "^0.1"
httpx = "^0.27"
python-magic = "^0.4"
aiofiles = "^24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.27"
black = "^24.10"
ruff = "^0.7"
mypy = "^1.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]   # Do not perform function call in default arguments (FastAPI pattern)

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
